version: "2"

run:
  timeout: 5m
  tests: false

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gosec
  settings:
    gosec:
      excludes:
        - G104
        - G115
        - G204
        - G301
        - G302
        - G304
        - G306
        - G401
        - G505
        - G703
        - G122
    staticcheck:
      checks:
        - "all"
        - "-QF1012"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
